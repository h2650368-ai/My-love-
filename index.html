<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050000">
  <title>NADA — YOU ARE MY LOVE ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #030101;
      color: white;
      font-family: Arial, sans-serif;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: .75;
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center,
          rgba(110, 0, 12, .22),
          transparent 65%);
    }

    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .top-label {
      color: #ff334b;
      font-size: 11px;
      letter-spacing: 5px;
      direction: ltr;
      margin-bottom: 15px;
      text-shadow: 0 0 15px #ff001e;
    }

    h1 {
      direction: ltr;
      font-size: clamp(34px, 10vw, 57px);
      font-weight: 900;
      color: #ff203e;
      letter-spacing: 3px;
      text-shadow:
        0 0 7px #ff001e,
        0 0 25px #a00016,
        0 0 55px #63000b;
      animation: pulse 2.5s infinite alternate;
    }

    .subtitle {
      margin-top: 12px;
      margin-bottom: 30px;
      color: #b98a8f;
      font-size: 13px;
    }

    .heart-wrap {
      position: relative;
      width: min(78vw, 310px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 18px rgba(255, 0, 35, .3));
    }

    .heart-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      animation: heartbeat 1.6s infinite;
    }

    .heart-input {
      position: relative;
      z-index: 2;
      width: 62%;
      padding: 12px 3px;
      border: 0;
      border-bottom: 1px solid rgba(255, 75, 95, .8);
      outline: none;
      background: transparent;
      color: white;
      text-align: center;
      direction: ltr;
      font-size: clamp(16px, 4.5vw, 22px);
      letter-spacing: 1px;
      text-shadow: 0 0 10px #ff1836;
    }

    .heart-input::placeholder {
      color: #f2a3ad;
      font-size: 12px;
      letter-spacing: 0;
    }

    .unlock {
      border: 1px solid #ff3049;
      border-radius: 30px;
      background: linear-gradient(135deg, #700010, #190006);
      color: white;
      padding: 14px 35px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 40, .2);
      transition: .3s;
    }

    .unlock:active {
      transform: scale(.95);
      box-shadow: 0 0 35px #ff002b;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      color: #ff6275;
      font-size: 13px;
    }

    .footer {
      position: absolute;
      bottom: 16px;
      color: #65454a;
      font-size: 10px;
      letter-spacing: 2px;
      direction: ltr;
    }

    @keyframes pulse {
      from { opacity: .8; }
      to { opacity: 1; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.045); }
      24% { transform: scale(1); }
      36% { transform: scale(1.025); }
    }

    @media (max-height: 650px) {
      .heart-wrap {
        width: min(56vw, 230px);
      }
      .subtitle {
        margin-bottom: 15px;
      }
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>
  <div class="glow"></div>

  <main class="screen">
    <div class="top-label">A SECRET MADE FOR YOU</div>

    <h1 id="loveTitle">LOVE YOU</h1>

    <p class="subtitle">
      بحبك حب مالوش تفسير ولا اي نهايه ❣️❣️
    </p>

    <div class="heart-wrap">
      <svg class="heart-svg" viewBox="0 0 300 300"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartColor" x1="0" y1="0"
                          x2="1" y2="1">
            <stop offset="0%" stop-color="#ff5268"/>
            <stop offset="45%" stop-color="#a90020"/>
            <stop offset="100%" stop-color="#35000b"/>
          </linearGradient>
          <filter id="heartGlow">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <path
          d="M150 255
             C130 235 35 165 35 100
             C35 35 115 24 150 82
             C185 24 265 35 265 100
             C265 165 170 235 150 255Z"
          fill="url(#heartColor)"
          stroke="#ff304d"
          stroke-width="2"
          filter="url(#heartGlow)"
        />

        <path
          d="M150 239 C120 210 55 158 55 103
             C55 65 90 51 117 78"
          fill="none"
          stroke="#ff9aa8"
          stroke-opacity=".5"
          stroke-width="3"
          stroke-linecap="round"
        />

        <path
          d="M145 100 L135 130 L157 143
             L140 164 L153 187"
          fill="none"
          stroke="#ff9aaa"
          stroke-opacity=".6"
          stroke-width="2"
        />

        <circle cx="115" cy="100" r="4" fill="#ff9aaa"/>
        <circle cx="184" cy="119" r="3" fill="#ff9aaa"/>
        <circle cx="150" cy="205" r="4" fill="#ff9aaa"/>
      </svg>

      <input
        id="password"
        class="heart-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="اكتبي السر هنا ♥"
        aria-label="Password"
      >
    </div>

    <button class="unlock" id="unlockButton">
      افتحي الهديه ♥
    </button>

    <p id="message" role="status"></p>

    <div class="footer">ONLY YOU • ONLY NADA</div>
  </main>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    let width, height, columns, drops;
    const fontSize = 13;
    const symbols = "01LOVEYOU♥ندىحب";
    
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      columns = Math.ceil(width / fontSize);
      drops = Array.from(
        { length: columns },
        () => Math.random() * -height / fontSize
      );
    }

    function drawMatrix() {
      ctx.fillStyle = "rgba(3, 1, 1, 0.12)";
      ctx.fillRect(0, 0, width, height);
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const char = symbols[
          Math.floor(Math.random() * symbols.length)
        ];

        ctx.fillStyle = Math.random() > .94 ? "#ff8290" : "#b50020";
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > .975) {
          drops[i] = 0;
        }

        drops[i] += .45 + Math.random() * .5;
      }

      requestAnimationFrame(drawMatrix);
    }

    resize();
    drawMatrix();
    window.addEventListener("resize", resize);

    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const button = document.getElementById("unlockButton");

    function unlock() {
      const entered = passwordInput.value.trim();

      if (entered === "11/9/2026") {
        message.textContent = "صح يا نور عيني ♥ جاري فتح حكايتنا...";
        button.textContent = "♥ بحبك يا ندي ♥";
        button.disabled = true;

       startExplosion();
      } else {
        message.textContent = "مش ده السر يا ندي.. جربي تاني ♥";
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    button.addEventListener("click", unlock);

    passwordInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") unlock();
    });
    function startExplosion() {
      const screen = document.querySelector(".screen");

      screen.innerHTML = `
        <div id="cinema" style="
          position:fixed;inset:0;background:#030000;
          display:flex;align-items:center;justify-content:center;
          flex-direction:column;z-index:10;overflow:hidden;
          font-family:Arial,sans-serif;">
          <canvas id="cinemaCanvas" style="
            position:absolute;inset:0;width:100%;height:100%;">
          </canvas>
          <div id="countdown" style="
            position:relative;color:#ff1738;font-size:100px;
            font-weight:900;text-shadow:0 0 30px red;">
            3
          </div>
          <div id="loveWords" style="
            position:relative;color:#ff2948;font-size:clamp(30px,8vw,65px);
            font-weight:900;text-align:center;direction:ltr;
            text-shadow:0 0 25px red;">
          </div>
        </div>`;

      const canvas = document.getElementById("cinemaCanvas");
      const ctx = canvas.getContext("2d");
      const countdown = document.getElementById("countdown");
      const words = document.getElementById("loveWords");

      let w, h, particles = [];

      function resize() {
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      function burst() {
        for (let i = 0; i < 240; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 13;
          particles.push({
            x: w / 2, y: h / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: 1 + Math.random() * 4
          });
        }
      }

      function animate() {
        ctx.fillStyle = "rgba(3,0,0,.20)";
        ctx.fillRect(0, 0, w, h);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= .985;
          p.vy *= .985;
          p.life -= .008;

          if (p.life > 0) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = Math.random() > .3
              ? "#ff1738" : "#ff9aa8";
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        }

        ctx.globalAlpha = 1;
        particles = particles.filter(p => p.life > 0);
        requestAnimationFrame(animate);
      }
      animate();

      let n = 3;
      const timer = setInterval(() => {
        n--;

        if (n > 0) {
          countdown.textContent = n;
          countdown.animate([
            { transform: "scale(2)", opacity: 0 },
            { transform: "scale(1)", opacity: 1 }
          ], { duration: 450 });
        } else {
          clearInterval(timer);
          countdown.textContent = "";
          burst();

          setTimeout(() => {
            countdown.style.display = "none";
            showLoveWord(0);
          }, 1000);
        }
      }, 1000);

      function showLoveWord(index) {
        const sequence = ["YOU", "ARE", "MY LOVE"];

        if (index >= sequence.length) {
          words.innerHTML = "";
          words.textContent = "♥";
          words.style.fontSize = "90px";

          setTimeout(() => {
            words.style.fontSize = "20px";
            words.textContent = "OUR STORY IS JUST BEGINNING";
            words.style.letterSpacing = "3px";

            setTimeout(() => {
              words.textContent = "";
              const note = document.createElement("div");
              note.style.cssText =
                "color:#ff6b80;font-size:16px;text-align:center;" +
                "direction:rtl;padding:20px;line-height:2;";
              note.textContent =
                "استعدي يا ندي.. لسه أحلى حكاية في عمرنا ♥";
              words.appendChild(note);

              const next = document.createElement("button");
              next.textContent = "كمّلي يا نور عيني ♥";
              next.style.cssText =
                "margin-top:25px;padding:14px 28px;" +
                "border:1px solid #ff2948;border-radius:30px;" +
                "background:#39000c;color:white;font-size:16px;";
              next.onclick = () => {
                words.innerHTML = "";
                words.textContent =
                  "الواجهة التالية هنضيفها في الخطوة الجاية ♥";
              };
              words.appendChild(next);
            }, 1800);
          }, 1000);
          return;
        }

        words.textContent = sequence[index];
        words.animate([
          { opacity: 0, transform: "scale(.2) rotate(-8deg)",
            filter: "blur(12px)" },
          { opacity: 1, transform: "scale(1.15) rotate(0deg)",
            filter: "blur(0)" },
          { opacity: 1, transform: "scale(1)",
            filter: "blur(0)" }
        ], { duration: 1100, easing: "ease-out" });

        setTimeout(() => {
          words.animate([
            { opacity: 1, transform: "scale(1)" },
            { opacity: 0, transform: "scale(2)",
              filter: "blur(12px)" }
          ], { duration: 450, fill: "forwards" });

          setTimeout(() => showLoveWord(index + 1), 500);
        }, 1400);
      }
    }
  </script>
</body>
</html>
