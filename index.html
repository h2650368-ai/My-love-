<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050000">
  <title>NADA — YOU ARE MY LOVE ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #030101;
      color: white;
      font-family: Arial, sans-serif;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: .75;
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center,
          rgba(110, 0, 12, .22),
          transparent 65%);
    }

    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .top-label {
      color: #ff334b;
      font-size: 11px;
      letter-spacing: 5px;
      direction: ltr;
      margin-bottom: 15px;
      text-shadow: 0 0 15px #ff001e;
    }

    h1 {
      direction: ltr;
      font-size: clamp(34px, 10vw, 57px);
      font-weight: 900;
      color: #ff203e;
      letter-spacing: 3px;
      text-shadow:
        0 0 7px #ff001e,
        0 0 25px #a00016,
        0 0 55px #63000b;
      animation: pulse 2.5s infinite alternate;
    }

    .subtitle {
      margin-top: 12px;
      margin-bottom: 30px;
      color: #b98a8f;
      font-size: 13px;
    }

    .heart-wrap {
      position: relative;
      width: min(78vw, 310px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 18px rgba(255, 0, 35, .3));
    }

    .heart-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      animation: heartbeat 1.6s infinite;
    }

    .heart-input {
      position: relative;
      z-index: 2;
      width: 62%;
      padding: 12px 3px;
      border: 0;
      border-bottom: 1px solid rgba(255, 75, 95, .8);
      outline: none;
      background: transparent;
      color: white;
      text-align: center;
      direction: ltr;
      font-size: clamp(16px, 4.5vw, 22px);
      letter-spacing: 1px;
      text-shadow: 0 0 10px #ff1836;
    }

    .heart-input::placeholder {
      color: #f2a3ad;
      font-size: 12px;
      letter-spacing: 0;
    }

    .unlock {
      border: 1px solid #ff3049;
      border-radius: 30px;
      background: linear-gradient(135deg, #700010, #190006);
      color: white;
      padding: 14px 35px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 40, .2);
      transition: .3s;
    }

    .unlock:active {
      transform: scale(.95);
      box-shadow: 0 0 35px #ff002b;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      color: #ff6275;
      font-size: 13px;
    }

    .footer {
      position: absolute;
      bottom: 16px;
      color: #65454a;
      font-size: 10px;
      letter-spacing: 2px;
      direction: ltr;
    }

    @keyframes pulse {
      from { opacity: .8; }
      to { opacity: 1; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.045); }
      24% { transform: scale(1); }
      36% { transform: scale(1.025); }
    }

    @media (max-height: 650px) {
      .heart-wrap {
        width: min(56vw, 230px);
      }
      .subtitle {
        margin-bottom: 15px;
      }
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>
  <div class="glow"></div>

  <main class="screen">
    <div class="top-label">A SECRET MADE FOR YOU</div>

    <h1 id="loveTitle">LOVE YOU</h1>

    <p class="subtitle">
      في حكاية محدش يعرف سرها غيرك يا ندي ♥
    </p>

    <div class="heart-wrap">
      <svg class="heart-svg" viewBox="0 0 300 300"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartColor" x1="0" y1="0"
                          x2="1" y2="1">
            <stop offset="0%" stop-color="#ff5268"/>
            <stop offset="45%" stop-color="#a90020"/>
            <stop offset="100%" stop-color="#35000b"/>
          </linearGradient>
          <filter id="heartGlow">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <path
          d="M150 255
             C130 235 35 165 35 100
             C35 35 115 24 150 82
             C185 24 265 35 265 100
             C265 165 170 235 150 255Z"
          fill="url(#heartColor)"
          stroke="#ff304d"
          stroke-width="2"
          filter="url(#heartGlow)"
        />

        <path
          d="M150 239 C120 210 55 158 55 103
             C55 65 90 51 117 78"
          fill="none"
          stroke="#ff9aa8"
          stroke-opacity=".5"
          stroke-width="3"
          stroke-linecap="round"
        />

        <path
          d="M145 100 L135 130 L157 143
             L140 164 L153 187"
          fill="none"
          stroke="#ff9aaa"
          stroke-opacity=".6"
          stroke-width="2"
        />

        <circle cx="115" cy="100" r="4" fill="#ff9aaa"/>
        <circle cx="184" cy="119" r="3" fill="#ff9aaa"/>
        <circle cx="150" cy="205" r="4" fill="#ff9aaa"/>
      </svg>

      <input
        id="password"
        class="heart-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="اكتبي السر هنا ♥"
        aria-label="كلمة السر"
      >
    </div>

    <button class="unlock" id="unlockButton">
      افتحي حكايتنا ♥
    </button>

    <p id="message" role="status"></p>

    <div class="footer">ONLY YOU • ONLY NADA</div>
  </main>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    let width, height, columns, drops;
    const fontSize = 13;
    const symbols = "01LOVEYOU♥ندىحب";
    
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      columns = Math.ceil(width / fontSize);
      drops = Array.from(
        { length: columns },
        () => Math.random() * -height / fontSize
      );
    }

    function drawMatrix() {
      ctx.fillStyle = "rgba(3, 1, 1, 0.12)";
      ctx.fillRect(0, 0, width, height);
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const char = symbols[
          Math.floor(Math.random() * symbols.length)
        ];

        ctx.fillStyle = Math.random() > .94 ? "#ff8290" : "#b50020";
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > .975) {
          drops[i] = 0;
        }

        drops[i] += .45 + Math.random() * .5;
      }

      requestAnimationFrame(drawMatrix);
    }

    resize();
    drawMatrix();
    window.addEventListener("resize", resize);

    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const button = document.getElementById("unlockButton");

    function unlock() {
      const entered = passwordInput.value.trim();

      if (entered === "11/9/2026") {
        message.textContent = "صح يا نور عيني ♥ جاري فتح حكايتنا...";
        button.textContent = "♥ بحبك يا ندي ♥";
        button.disabled = true;

        // هنضيف انتقال الانفجار والواجهة الثانية في الخطوة القادمة.
      } else {
        message.textContent = "مش ده السر يا ندي.. جربي تاني ♥";
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    button.addEventListener("click", unlock);

    passwordInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") unlock();
    });
  </script>
</body>
</html>
